https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--roxo:#670892;--roxo-2:#4B0670;--roxo-9:#2A0440;--amarelo:#FDC10D;--morango:#EF3E74;--verde:#1FA855;--verde-2:#178A45;--azul:#2F7BEA;--laranja:#F08A12;--vermelho:#D6284F;
--bg:#F7F2FA;--card:#FFFFFF;--ink:#24103A;--muted:#6E5C80;--line:#E8DDF0;--chip:#F1E6F8;--soft:#FBF7FD;--shadow:0 8px 24px -14px rgba(60,10,90,.35);
--ff-d:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;--ff:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150720;--card:#221031;--ink:#F8EEFF;--muted:#C4AED6;--line:#3A1E50;--chip:#301446;--soft:#1B0A28;--shadow:0 8px 24px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#150720;--card:#221031;--ink:#F8EEFF;--muted:#C4AED6;--line:#3A1E50;--chip:#301446;--soft:#1B0A28;--shadow:0 8px 24px -14px rgba(0,0,0,.7)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ff);overflow-x:hidden}
h1,h2,h3{font-family:var(--ff-d);margin:0;line-height:1.1;font-weight:600}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;fill:currentColor;flex:none}
.demo{background:var(--roxo-9);color:#F3DDFF;font-size:12.5px;text-align:center;padding:5px 12px}
.demo b{color:var(--amarelo)}
/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 28px)}
.side{background:var(--roxo);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--ff-d);font-weight:700;font-size:16px;line-height:1.1}
.side .brand img{width:42px;height:42px}
.side .brand small{display:block;font:600 12px var(--ff);opacity:.8}
.side button.nv{display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;text-align:left;width:100%}
.side button.nv:hover{background:rgba(255,255,255,.1)}
.side button.nv[aria-current="page"]{background:var(--amarelo);color:var(--roxo-9)}
.side .foot{margin-top:auto;font-size:12px;opacity:.8;padding:8px}
.main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin-right:auto}
.mbar{display:none}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:70;transform:translateX(-100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}.side.open{transform:none}.mbar{display:flex;align-items:center;gap:10px;background:var(--roxo);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:50}.mbar b{font-family:var(--ff-d);font-size:17px}.mbar button{background:none;border:0;color:#fff;padding:6px}.main{padding:16px 14px 60px}}
/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.kpi small{color:var(--muted);font-weight:700;font-size:13px}
.kpi b{display:block;font-family:var(--ff-d);font-size:28px;line-height:1.15;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;font-weight:800}
.up{color:var(--verde)}.dn{color:var(--vermelho)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;text-decoration:none;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn-p{background:var(--roxo);color:#fff}.btn-y{background:var(--amarelo);color:var(--roxo-9)}.btn-g{background:var(--verde);color:#fff}.btn-l{background:var(--chip);color:var(--ink)}.btn-r{background:var(--vermelho);color:#fff}
.btn-sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.ex{background:#FFF3C4;color:#7A5600}
.tag.ok{background:#DDF6E6;color:#11622F}.tag.warn{background:#FFE9C7;color:#8A4B00}.tag.bad{background:#FFDDE5;color:#9B1239}.tag.info{background:#E2EDFF;color:#1B4FA0}.tag.pur{background:#EFDDFB;color:#5A0782}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--roxo);color:#fff}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lab{font-weight:800;font-size:13px}
.inp{width:100%;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:9px 12px;font:600 14px var(--ff);min-width:0}
.inp:focus{outline:none;border-color:var(--roxo)}
textarea.inp{resize:vertical}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.t th button{border:0;background:none;font:inherit;color:inherit;padding:0;display:inline-flex;gap:4px;align-items:center}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tbody tr:hover{background:var(--soft)}
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbar .inp{max-width:280px}
/* custom select */
.cs{position:relative;min-width:0}
.cs-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:9px 14px 9px 12px;font:600 14px var(--ff);text-align:left;min-height:42px}
.cs-btn>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-btn:focus-visible,.cs.open .cs-btn{outline:none;border-color:var(--roxo)}
.cs-btn .chev{width:16px;height:16px;margin-right:4px;flex:none;transition:transform .2s;color:var(--roxo)}
.cs.open .chev{transform:rotate(180deg)}
.cs-btn .ph{color:var(--muted)}
.cs-list{position:absolute;left:0;min-width:100%;top:calc(100% + 5px);z-index:60;background:var(--card);border:2px solid var(--roxo);border-radius:14px;box-shadow:var(--shadow);max-height:250px;overflow:auto;padding:5px;margin:0;list-style:none;display:none}
.cs.open .cs-list{display:block}.cs.up .cs-list{top:auto;bottom:calc(100% + 5px)}
.cs-list li{padding:8px 11px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;white-space:nowrap}
.cs-list li small{color:var(--muted);font-weight:800}
.cs-list li.act{background:var(--chip)}
.cs-list li[aria-selected="true"]{background:var(--roxo);color:#fff}
.cs-list li[aria-selected="true"] small{color:#fff}
/* date picker */
.dp{position:relative;min-width:0}
.dp .inp{padding-right:42px;font-variant-numeric:tabular-nums}
.dp .cal-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--roxo);padding:6px;border-radius:8px}
.cal{position:absolute;z-index:65;top:calc(100% + 5px);left:0;background:var(--card);border:2px solid var(--roxo);border-radius:16px;box-shadow:var(--shadow);padding:12px;width:282px;display:none}
.dp.open .cal{display:block}
.dp.right .cal{left:auto;right:0}
.cal header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal header b{font-family:var(--ff-d);font-weight:600;text-transform:capitalize}
.cal header button{border:0;background:var(--chip);border-radius:8px;width:30px;height:30px;font-weight:800}
.cal .wd,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd span{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .days button{border:0;background:none;border-radius:9px;height:34px;font-weight:700;font-size:13px}
.cal .days button:hover,.cal .days button.act{background:var(--chip)}
.cal .days button.sel{background:var(--roxo);color:#fff}
.cal .days button.today{box-shadow:inset 0 0 0 2px var(--amarelo)}
.cal .days button.out{opacity:.35}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,2,32,.55);z-index:80;display:none}
.scrim.on{display:block}
.dlg{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,100% - 24px);max-height:calc(100% - 40px);overflow:auto;background:var(--card);border-radius:22px;padding:20px;display:none;box-shadow:0 30px 70px -20px rgba(0,0,0,.55)}
.dlg.on{display:block}
.dlg .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dlg .x{border:0;background:var(--chip);border-radius:50%;width:36px;height:36px;font-size:18px}
.dlg .ft{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;z-index:120;left:16px;right:16px;margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--roxo-9);color:#fff;padding:11px 18px;border-radius:999px;font-weight:800;opacity:0;transform:translateY(16px);transition:all .25s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:none}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--ff);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.bar-row .b{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar-row .b i{display:block;height:100%;background:linear-gradient(90deg,var(--roxo),#9B3CD1);border-radius:99px}
.bar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:30px;text-align:center;color:var(--muted)}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#C9B8D6;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--verde)}
.switch input:checked+span::before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:3px solid var(--amarelo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}@media (max-width:900px){.g21{grid-template-columns:minmax(0,1fr)}}.ea{flex-wrap:wrap}

fieldset{min-width:0;border:0;margin:0;padding:0}
.dlg{overflow-x:hidden}
.dlg .bd{min-width:0}
.dlg img,.dlg svg{max-width:100%}
@media (max-width:560px){.dlg{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92%;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}}
.card,.tw,.main{max-width:100%}
.hbars{display:flex;align-items:stretch;gap:8px;flex:1;min-height:200px;padding-top:6px}
.hbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.hbars .t{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:2px solid var(--line)}
.hbars .t i{display:block;width:78%;max-width:46px;background:var(--roxo);border-radius:8px 8px 3px 3px;position:relative;min-height:3px}
.hbars .t i.hi{background:var(--amarelo)}

  <div class="field" style="margin-top:12px"><label for="cO">Observações do pedido</label><textarea class="inp" id="cO" rows="2" placeholder="Ex.: interfone 12">${esc(S.obs)}</textarea></div>
  <div class="row" style="margin-top:12px;align-items:flex-end"><div class="field" style="flex:1"><label for="cC">Cupom</label><input class="inp" id="cC" placeholder="Ex.: MACUXI10" value="${esc(S.cupom)}"></div><button class="btn btn-l" type="button" data-cup>Aplicar</button></div><small class="muted">Cupons de exemplo: MACUXI10 e FRETEGRATIS.</small>
  <div class="tot"><div><span>Subtotal</span><span>${brl(sub)}</span></div>${S.mode==='delivery'?`<div><span>Entrega (${esc(S.user.bairro)})</span><span>${brl(f)}*</span></div>`:''}${ds?`<div class="up"><span>Cupom ${esc(S.cupom)}</span><span>− ${brl(ds)}</span></div>`:''}<div class="big"><span>Total</span><span>${brl(tot)}</span></div></div>${sub<10&&S.cart.length?'<p class="err">Pedido mínimo de R$ 10,00.</p>':''}`,
  S.cart.length?[{t:'Fazer pedido · '+brl(tot),cls:'btn-g',fn:()=>{if(sub<10)return false;place(tot,f,ds)}}]:[]);
  CSelect($('#cP',d),{label:'lbP',opts:['Pix','Cartão de crédito','Cartão de débito','Dinheiro'].map(x=>({v:x,l:x})),val:S.pag,on:v=>{S.pag=v;save();openCart()}});
  $$('[data-mode]',d).forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();openCart()});$$('[data-rm]',d).forEach(b=>b.onclick=()=>{S.cart.splice(+b.dataset.rm,1);save();render();openCart()});
  const t=$('#cT',d);if(t)t.oninput=()=>{S.troco=t.value;save()};$('#cO',d).oninput=e=>{S.obs=e.target.value;save()};
  $('[data-cup]',d).onclick=()=>{const c=$('#cC',d).value.trim().toUpperCase();if(c&&!CUPONS[c]){toast('Cupom inválido');return}S.cupom=c;save();toast(c?'Cupom aplicado: '+CUPONS[c].t:'Cupom removido');openCart()}}
function place(tot,f,ds){const last=S.hist[0];const o={num:(last?last.num:3000)+1+Math.floor(Math.random()*40),senha:Math.floor(Math.random()*90)+10,at:Date.now(),mode:S.mode,lines:S.cart,sub:cartSub(),fee:f,desc:ds,total:tot,pag:S.pag,status:'Recebido'};S.active=o;S.cart=[];S.cupom='';S.stamps++;save();tab='orders';render();toast('Pedido enviado para a loja');schedule()}
function advance(){const a=S.active;if(!a)return;const steps=a.mode==='delivery'?['Recebido','Em preparo','Saiu para entrega','Entregue']:['Recebido','Em preparo','Pronto','Entregue'];const i=steps.indexOf(a.status);a.status=steps[Math.min(i+1,3)];if(a.status==='Entregue'){S.hist.unshift(a);S.active=null;toast('Pedido entregue. Bom apetite!')}save();render()}
let tmr;function schedule(){clearInterval(tmr);tmr=setInterval(()=>{if(!S.active){clearInterval(tmr);return}advance()},12000)}
document.body.insertAdjacentHTML('afterbegin',demoStrip('Pedidos de exemplo, acompanhamento simulado'));
$$('.tb button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0)});$('#cartFab').onclick=openCart;
render();if(S.active)schedule();
</script></body></html>
