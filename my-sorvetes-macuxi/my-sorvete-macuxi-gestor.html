doka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--roxo:#670892;--roxo-2:#4B0670;--roxo-9:#2A0440;--amarelo:#FDC10D;--morango:#EF3E74;--verde:#1FA855;--verde-2:#178A45;--azul:#2F7BEA;--laranja:#F08A12;--vermelho:#D6284F;
--bg:#F7F2FA;--card:#FFFFFF;--ink:#24103A;--muted:#6E5C80;--line:#E8DDF0;--chip:#F1E6F8;--soft:#FBF7FD;--shadow:0 8px 24px -14px rgba(60,10,90,.35);
--ff-d:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;--ff:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150720;--card:#221031;--ink:#F8EEFF;--muted:#C4AED6;--line:#3A1E50;--chip:#301446;--soft:#1B0A28;--shadow:0 8px 24px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#150720;--card:#221031;--ink:#F8EEFF;--muted:#C4AED6;--line:#3A1E50;--chip:#301446;--soft:#1B0A28;--shadow:0 8px 24px -14px rgba(0,0,0,.7)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ff);overflow-x:hidden}
h1,h2,h3{font-family:var(--ff-d);margin:0;line-height:1.1;font-weight:600}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;fill:currentColor;flex:none}
.demo{background:var(--roxo-9);color:#F3DDFF;font-size:12.5px;text-align:center;padding:5px 12px}
.demo b{color:var(--amarelo)}
/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 28px)}
.side{background:var(--roxo);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--ff-d);font-weight:700;font-size:16px;line-height:1.1}
.side .brand img{width:42px;height:42px}
.side .brand small{display:block;font:600 12px var(--ff);opacity:.8}
.side button.nv{display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;text-align:left;width:100%}
.side button.nv:hover{background:rgba(255,255,255,.1)}
.side button.nv[aria-current="page"]{background:var(--amarelo);color:var(--roxo-9)}
.side .foot{margin-top:auto;font-size:12px;opacity:.8;padding:8px}
.main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin-right:auto}
.mbar{display:none}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:70;transform:translateX(-100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}.side.open{transform:none}.mbar{display:flex;align-items:center;gap:10px;background:var(--roxo);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:50}.mbar b{font-family:var(--ff-d);font-size:17px}.mbar button{background:none;border:0;color:#fff;padding:6px}.main{padding:16px 14px 60px}}
/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.kpi small{color:var(--muted);font-weight:700;font-size:13px}
.kpi b{display:block;font-family:var(--ff-d);font-size:28px;line-height:1.15;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;font-weight:800}
.up{color:var(--verde)}.dn{color:var(--vermelho)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;text-decoration:none;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn-p{background:var(--roxo);color:#fff}.btn-y{background:var(--amarelo);color:var(--roxo-9)}.btn-g{background:var(--verde);color:#fff}.btn-l{background:var(--chip);color:var(--ink)}.btn-r{background:var(--vermelho);color:#fff}
.btn-sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.ex{background:#FFF3C4;color:#7A5600}
.tag.ok{background:#DDF6E6;color:#11622F}.tag.warn{background:#FFE9C7;color:#8A4B00}.tag.bad{background:#FFDDE5;color:#9B1239}.tag.info{background:#E2EDFF;color:#1B4FA0}.tag.pur{background:#EFDDFB;color:#5A0782}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--roxo);color:#fff}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lab{font-weight:800;font-size:13px}
.inp{width:100%;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:9px 12px;font:600 14px var(--ff);min-width:0}
.inp:focus{outline:none;border-color:var(--roxo)}
textarea.inp{resize:vertical}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.t th button{border:0;background:none;font:inherit;color:inherit;padding:0;display:inline-flex;gap:4px;align-items:center}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tbody tr:hover{background:var(--soft)}
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbar .inp{max-width:280px}
/* custom select */
.cs{position:relative;min-width:0}
.cs-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:9px 14px 9px 12px;font:600 14px var(--ff);text-align:left;min-height:42px}
.cs-btn>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-btn:focus-visible,.cs.open .cs-btn{outline:none;border-color:var(--roxo)}
.cs-btn .chev{width:16px;height:16px;margin-right:4px;flex:none;transition:transform .2s;color:var(--roxo)}
.cs.open .chev{transform:rotate(180deg)}
.cs-btn .ph{color:var(--muted)}
.cs-list{position:absolute;left:0;min-width:100%;top:calc(100% + 5px);z-index:60;background:var(--card);border:2px solid var(--roxo);border-radius:14px;box-shadow:var(--shadow);max-height:250px;overflow:auto;padding:5px;margin:0;list-style:none;display:none}
.cs.open .cs-list{display:block}.cs.up .cs-list{top:auto;bottom:calc(100% + 5px)}
.cs-list li{padding:8px 11px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;white-space:nowrap}
.cs-list li small{color:var(--muted);font-weight:800}
.cs-list li.act{background:var(--chip)}
.cs-list li[aria-selected="true"]{background:var(--roxo);color:#fff}
.cs-list li[aria-selected="true"] small{color:#fff}
/* date picker */
.dp{position:relative;min-width:0}
.dp .inp{padding-right:42px;font-variant-numeric:tabular-nums}
.dp .cal-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--roxo);padding:6px;border-radius:8px}
.cal{position:absolute;z-index:65;top:calc(100% + 5px);left:0;background:var(--card);border:2px solid var(--roxo);border-radius:16px;box-shadow:var(--shadow);padding:12px;width:282px;display:none}
.dp.open .cal{display:block}
.dp.right .cal{left:auto;right:0}
.cal header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal header b{font-family:var(--ff-d);font-weight:600;text-transform:capitalize}
.cal header button{border:0;background:var(--chip);border-radius:8px;width:30px;height:30px;font-weight:800}
.cal .wd,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd span{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .days button{border:0;background:none;border-radius:9px;height:34px;font-weight:700;font-size:13px}
.cal .days button:hover,.cal .days button.act{background:var(--chip)}
.cal .days button.sel{background:var(--roxo);color:#fff}
.cal .days button.today{box-shadow:inset 0 0 0 2px var(--amarelo)}
.cal .days button.out{opacity:.35}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,2,32,.55);z-index:80;display:none}
.scrim.on{display:block}
.dlg{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,100% - 24px);max-height:calc(100% - 40px);overflow:auto;background:var(--card);border-radius:22px;padding:20px;display:none;box-shadow:0 30px 70px -20px rgba(0,0,0,.55)}
.dlg.on{display:block}
.dlg .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dlg .x{border:0;background:var(--chip);border-radius:50%;width:36px;height:36px;font-size:18px}
.dlg .ft{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;z-index:120;left:16px;right:16px;margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--roxo-9);color:#fff;padding:11px 18px;border-radius:999px;font-weight:800;opacity:0;transform:translateY(16px);transition:all .25s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:none}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--ff);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.bar-row .b{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar-row .b i{display:block;height:100%;background:linear-gradient(90deg,var(--roxo),#9B3CD1);border-radius:99px}
.bar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:30px;text-align:center;color:var(--muted)}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#C9B8D6;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--verde)}
.switch input:checked+span::before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:3px solid var(--amarelo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}@media (max-width:900px){.g21{grid-template-columns:minmax(0,1fr)}}.ea{flex-wrap:wrap}

fieldset{min-width:0;border:0;margin:0;padding:0}
.dlg{overflow-x:hidden}
.dlg .bd{min-width:0}
.dlg img,.dlg svg{max-width:100%}
@media (max-width:560px){.dlg{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92%;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}}
.card,.tw,.main{max-width:100%}
.hbars{display:flex;align-items:stretch;gap:8px;flex:1;min-height:200px;padding-top:6px}
.hbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.hbars .t{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:2px solid var(--line)}
.hbars .t i{display:block;width:78%;max-width:46px;background:var(--roxo);border-radius:8px 8px 3px 3px;position:relative;min-height:3px}
.hbars .t i.hi{background:var(--amarelo)}

  ${per.k==='custom'?`<div class="row card" style="margin-bottom:14px"><div class="field"><span class="lab" id="lA">De</span><div id="dA"></div></div><div class="field"><span class="lab" id="lB">Até</span><div id="dB"></div></div><span class="muted" style="align-self:flex-end;padding-bottom:10px">${fmtD(R[0])} a ${fmtD(addDays(R[1],-1))}</span></div>`:`<p class="muted" style="margin:-8px 0 14px">${fmtD(R[0])} a ${fmtD(addDays(R[1],-1))} · horário da loja 13:00–22:00 (segunda a partir de 15:00)</p>`}
  <div class="grid g4"><div class="card kpi"><small>Faturamento</small><b>${brl(s.fat)}</b>${dlt(s.fat,p.fat)}</div><div class="card kpi"><small>Pedidos</small><b>${num(s.n)}</b>${dlt(s.n,p.n)}</div><div class="card kpi"><small>Ticket médio</small><b>${brl(s.tk)}</b>${dlt(s.tk,p.tk)}</div><div class="card kpi"><small>Cancelamentos</small><b>${s.canc} <span style="font-size:15px" class="muted">(${(s.cp*100).toFixed(1).replace('.',',')}%)</span></b>${dlt(s.canc,p.canc,true)}</div></div>
  <div class="grid g21" style="margin-top:14px"><section class="card"><h2>Faturamento ${days<=1?'por hora':'por dia'}</h2>${lineChart(serie,{})}</section><section class="card"><h2>Canais de venda</h2>${donut(Object.entries(can).map(([l,v])=>({l,v,c:COLORS[l]})))}</section></div>
  <div class="grid g3" style="margin-top:14px"><section class="card fill"><h2>Pedidos por horário</h2><p class="muted" style="margin:4px 0 14px;font-size:13px">Pico às ${hrs[pk].x.replace('h',':00')}</p>${htmlBars(hrs,{hi:pk})}</section><section class="card"><h2>Mais vendidos</h2><div style="margin-top:8px">${bars(top)}</div></section><section class="card"><h2>Tempos e pagamentos</h2><div class="grid g2" style="margin:10px 0"><div class="kpi"><small>Preparo médio</small><b>${Math.round(s.prep)} min</b></div><div class="kpi"><small>Entrega média</small><b>${Math.round(s.ent)} min</b></div></div>${bars(Object.entries(pag).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v})),brl)}</section></div>`}
function bDash(){$$('[data-per]').forEach(b=>b.onclick=()=>{per.k=b.dataset.per;if(per.k==='custom'&&!per.a){per.a=dayKey(addDays(NOW,-13)).replace(/-/g,'/');per.b=dayKey(NOW).replace(/-/g,'/')}store.set('per',per);render()});
  if($('#dA')){DatePicker($('#dA'),{label:'lA',val:per.a,on:d=>{per.a=d.getTime();store.set('per',per);if(per.b&&per.a<=per.b)render()}});DatePicker($('#dB'),{label:'lB',val:per.b,right:true,on:d=>{per.b=d.getTime();store.set('per',per);if(per.a&&per.a<=per.b)render()}})}}
function today(){const a=startDay(NOW);return ORD.filter(o=>o.at>=a.getTime()&&o.status!=='Cancelado')}
function vCaixa(){const t=today();const by={};t.filter(o=>o.canal!=='Pigz'&&o.canal!=='iFood').forEach(o=>by[o.pag]=(by[o.pag]||0)+o.total);const app=t.filter(o=>o.canal==='Pigz'||o.canal==='iFood').reduce((s,o)=>s+o.total,0);
  const din=by['Dinheiro']||0;const sg=CX.sangrias.reduce((s,x)=>s+x.v,0);const su=CX.supr.reduce((s,x)=>s+x.v,0);const esper=CX.fundo+din-sg+su;const cont=parseFloat(String(CX.contado).replace(/\./g,'').replace(',','.'));const dif=isNaN(cont)?null:cont-esper;
  const past=[1,2,3,4,5,6,7].map(k=>{const a=addDays(startDay(NOW),-k),b=addDays(a,1);const os=ORD.filter(o=>o.at>=a&&o.at<b&&o.status!=='Cancelado');const d=os.filter(o=>o.pag==='Dinheiro').reduce((s,o)=>s+o.total,0);return{d:a,tot:os.reduce((s,o)=>s+o.total,0),din:d,dif:[0,0,-2.5,0,1,0,-5][k-1]}});
  return `<div class="top"><h1>Caixa do dia</h1><span class="tag ${CX.fechado?'bad':'ok'}">${CX.fechado?'Fechado':'Aberto'} · ${fmtD(NOW)}</span></div>
  <div class="grid g4"><div class="card kpi"><small>Fundo de abertura (13:00)</small><b>${brl(CX.fundo)}</b></div><div class="card kpi"><small>Vendas no caixa</small><b>${brl(Object.values(by).reduce((a,b)=>a+b,0))}</b></div><div class="card kpi"><small>Vendas nos apps (Pigz/iFood)</small><b>${brl(app)}</b></div><div class="card kpi"><small>Dinheiro esperado na gaveta</small><b>${brl(esper)}</b></div></div>
  <div class="grid g2" style="margin-top:14px"><section class="card"><h2>Formas de pagamento</h2><div style="margin-top:8px">${bars(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v})),brl)}</div><h3 style="margin-top:16px">Conciliação</h3><div class="tw" style="margin-top:6px"><table class="t"><tbody>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${brl(v)}</td><td>${k==='Dinheiro'?'<span class="tag warn">conferir na gaveta</span>':k==='Pix'?'<span class="tag ok">conciliado com o extrato</span>':'<span class="tag info">conferir na maquininha</span>'}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><div class="row" style="justify-content:space-between"><h2>Sangrias e suprimentos</h2><div class="row"><button class="btn btn-l btn-sm" data-mov="s" ${CX.fechado?'disabled':''}>+ Sangria</button><button class="btn btn-l btn-sm" data-mov="u" ${CX.fechado?'disabled':''}>+ Suprimento</button></div></div><div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Hora</th><th>Tipo</th><th>Motivo</th><th class="n">Valor</th></tr></thead><tbody>${[...CX.sangrias.map(x=>({...x,tp:'Sangria'})),...CX.supr.map(x=>({...x,tp:'Suprimento'}))].sort((a,b)=>a.h.localeCompare(b.h)).map(x=>`<tr><td>${x.h}</td><td>${x.tp}</td><td>${esc(x.m)}</td><td class="n ${x.tp==='Sangria'?'dn':'up'}">${x.tp==='Sangria'?'− ':'+ '}${brl(x.v)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum movimento.</td></tr>'}</tbody></table></div>
  <h3 style="margin-top:16px">Fechamento</h3><div class="row" style="margin-top:8px;align-items:flex-end"><div class="field"><label for="cont">Dinheiro contado na gaveta (R$)</label><input class="inp" id="cont" inputmode="decimal" placeholder="0,00" value="${esc(CX.contado)}" ${CX.fechado?'disabled':''}></div><button class="btn ${CX.fechado?'btn-l':'btn-p'}" data-close>${CX.fechado?'Reabrir caixa':'Fechar caixa'}</button></div>${dif!=null?`<p style="margin:10px 0 0;font-weight:800" class="${Math.abs(dif)<.01?'up':'dn'}">${Math.abs(dif)<.01?'Caixa confere.':`Diferença de ${brl(dif)} em relação ao esperado (${brl(esper)}).`}</p>`:''}</section></div>
  <section class="card" style="margin-top:14px"><h2>Fechamentos anteriores</h2><div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Data</th><th class="n">Vendas</th><th class="n">Dinheiro</th><th class="n">Diferença</th><th>Status</th></tr></thead><tbody>${past.map(x=>`<tr><td>${fmtD(x.d)} · ${DAYN[x.d.getDay()]}</td><td class="n">${brl(x.tot)}</td><td class="n">${brl(x.din)}</td><td class="n ${x.dif<0?'dn':''}">${brl(x.dif)}</td><td>${x.dif===0?'<span class="tag ok">Conferido</span>':'<span class="tag warn">Com diferença</span>'}</td></tr>`).join('')}</tbody></table></div></section>`}
function bCaixa(){$$('[data-mov]').forEach(b=>b.onclick=()=>{const s=b.dataset.mov==='s';dialog(s?'Nova sangria':'Novo suprimento',`<div class="grid" style="gap:12px"><div class="field"><label for="mv">Valor (R$)</label><input class="inp" id="mv" inputmode="decimal" placeholder="0,00"></div><div class="field"><label for="mm">Motivo</label><input class="inp" id="mm" placeholder="${s?'Ex.: depósito no banco':'Ex.: troco extra'}"></div><p class="err" id="me" style="color:var(--vermelho);font-weight:800;margin:0"></p></div>`,[{t:'Cancelar'},{t:'Registrar',cls:'btn-p',fn:()=>{const v=parseFloat($('#mv').value.replace(/\./g,'').replace(',','.'));if(!(v>0)){$('#me').textContent='Informe um valor válido.';return false}(s?CX.sangrias:CX.supr).push({h:fmtH(new Date()),v,m:$('#mm').value||(s?'Sangria':'Suprimento')});store.set('cx',CX);render();toast(s?'Sangria registrada':'Suprimento registrado')}}])});
  const c=$('#cont');if(c)c.oninput=()=>{CX.contado=c.value;store.set('cx',CX)};c&&c.addEventListener('change',render);
  $('[data-close]').onclick=()=>{CX.fechado=!CX.fechado;store.set('cx',CX);render();toast(CX.fechado?'Caixa fechado':'Caixa reaberto')}}
function vMenu(){return `<div class="top"><h1>Cardápio</h1><span class="muted">${ITEMS.filter(i=>i.ph).length} itens com valor de exemplo aguardando confirmação</span></div><div class="card" id="mt"></div>`}
let mcat='all';
function bMenu(){const tools=`<div id="mcat" style="width:220px"></div>`;
  const T=Table($('#mt'),{ph:'Buscar item',tools,rows:()=>ITEMS.filter(i=>mcat==='all'||i.c===mcat),cols:[{t:'Item',k:'n',h:r=>`<b>${esc(r.n)}</b>${exTag(r.ph)}`},{t:'Categoria',v:r=>CATN[r.c]},{t:'Preço (R$)',n:1,sv:r=>r.p,v:r=>r.p,h:r=>`<input class="inp pin" data-price="${r.id}" inputmode="decimal" aria-label="Preço de ${esc(r.n)}" value="${r.p.toFixed(2).replace('.',',')}">`},{t:'Ativo',sort:false,h:r=>`<label class="switch"><input type="checkbox" data-on="${r.id}" ${r.on?'checked':''} aria-label="${r.on?'Pausar':'Ativar'} ${esc(r.n)}"><span></span></label>`},{t:'',sort:false,h:r=>r.ph?`<button class="btn btn-y btn-sm" data-conf="${r.id}">Confirmar valor</button>`:'<span class="tag ok">Confirmado</span>'}],
    onRender:el=>{$$('[data-on]',el).forEach(x=>x.onchange=()=>{const it=ITEMS.find(i=>i.id===x.dataset.on);it.on=x.checked;store.set('items',ITEMS);toast(`${it.n} ${it.on?'ativado':'pausado'}`)});
      $$('[data-price]',el).forEach(x=>x.onchange=()=>{const it=ITEMS.find(i=>i.id===x.dataset.price);const v=parseFloat(x.value.replace(/\./g,'').replace(',','.'));if(v>=0){it.p=v;x.value=v.toFixed(2).replace('.',',');store.set('items',ITEMS);toast(`Preço de ${it.n}: ${brl(v)}`)}});
      $$('[data-conf]',el).forEach(x=>x.onclick=()=>{const it=ITEMS.find(i=>i.id===x.dataset.conf);it.ph=false;store.set('items',ITEMS);T.draw();toast(`${it.n} confirmado`)})}});
  CSelect($('#mcat'),{aria:'Filtrar categoria',opts:[{v:'all',l:'Todas as categorias'},...MENU.cats.map(c=>({v:c[0],l:c[1]}))],val:mcat,on:v=>{mcat=v;T.draw()}})}
function vCup(){return `<div class="top"><h1>Cupons</h1><button class="btn btn-p" data-newc>+ Novo cupom</button></div><div class="card" id="ct"></div><p class="muted" style="font-size:13px">Cupons de exemplo para demonstração.</p>`}
function bCup(){const T=Table($('#ct'),{ph:'Buscar cupom',rows:()=>CUP,cols:[{t:'Código',k:'c',h:r=>`<b>${esc(r.c)}</b>`},{t:'Descrição',k:'d'},{t:'Tipo',k:'t'},{t:'Validade',sv:r=>r.val,v:r=>fmtD(new Date(r.val+'T12:00')),h:r=>{const d=new Date(r.val+'T12:00');return `${fmtD(d)} ${d<NOW?'<span class="tag bad">vencido</span>':''}`}},{t:'Usos',k:'u',n:1},{t:'Ativo',sort:false,h:(r)=>`<label class="switch"><input type="checkbox" data-cup="${esc(r.c)}" ${r.on?'checked':''} aria-label="Ativar ${esc(r.c)}"><span></span></label>`}],onRender:el=>$$('[data-cup]',el).forEach(x=>x.onchange=()=>{CUP.find(c=>c.c===x.dataset.cup).on=x.checked;store.set('cup',CUP)})});
  $('[data-newc]').onclick=()=>{let tipo='Percentual',val=addDays(NOW,30);const d=dialog('Novo cupom',`<div class="grid g2"><div class="field"><label for="nc">Código</label><input class="inp" id="nc" placeholder="Ex.: SUNDAE5" style="text-transform:uppercase"></div><div class="field"><span class="lab" id="lt">Tipo</span><div id="nt"></div></div><div class="field"><label for="nv">Valor</label><input class="inp" id="nv" inputmode="decimal" placeholder="10"></div><div class="field"><span class="lab" id="lv">Válido até</span><div id="nd"></div></div></div><div class="field" style="margin-top:12px"><label for="nd2">Descrição</label><input class="inp" id="nd2"></div><p id="ne" style="color:var(--vermelho);font-weight:800;margin:8px 0 0"></p>`,[{t:'Cancelar'},{t:'Criar cupom',cls:'btn-p',fn:()=>{const c=$('#nc').value.trim().toUpperCase();if(!c){$('#ne').textContent='Informe o código.';return false}CUP.unshift({c,d:$('#nd2').value||tipo,t:tipo,v:parseFloat(($('#nv').value||'0').replace(',','.')),val:dayKey(val),u:0,on:true});store.set('cup',CUP);T.draw();toast('Cupom criado')}}]);
    CSelect($('#nt',d),{label:'lt',opts:['Percentual','Valor fixo','Frete grátis'].map(x=>({v:x,l:x})),val:tipo,on:v=>tipo=v});DatePicker($('#nd',d),{label:'lv',val:val,right:true,on:x=>val=x})}}
function vCli(){return `<div class="top"><h1>Clientes e fidelidade</h1></div><div class="grid g4" id="ck"></div><div class="card" style="margin-top:14px" id="clt"></div>`}
function bCli(){const m={};ORD.filter(o=>o.cli!=='Cliente balcão'&&o.status!=='Cancelado').forEach(o=>{const c=m[o.cli]||(m[o.cli]={n:o.cli,q:0,t:0,last:0,b:o.bairro});c.q++;c.t+=o.total;c.last=Math.max(c.last,o.at);if(o.bairro)c.b=o.bairro});const L=Object.values(m);
  $('#ck').innerHTML=`<div class="card kpi"><small>Clientes identificados (90 dias)</small><b>${L.length}</b></div><div class="card kpi"><small>Pedidos por cliente</small><b>${(L.reduce((s,c)=>s+c.q,0)/L.length).toFixed(1).replace('.',',')}</b></div><div class="card kpi"><small>Prêmios de fidelidade liberados</small><b>${L.reduce((s,c)=>s+Math.floor(c.q/10),0)}</b></div><div class="card kpi"><small>Sem pedir há mais de 30 dias</small><b>${L.filter(c=>NOW-c.last>30*864e5).length}</b></div>`;
  Table($('#clt'),{ph:'Buscar cliente',rows:L,cols:[{t:'Cliente',k:'n',h:r=>`<b>${esc(r.n)}</b>`},{t:'Bairro',v:r=>r.b||'Retira na loja'},{t:'Pedidos',k:'q',n:1},{t:'Total gasto',n:1,sv:r=>r.t,v:r=>brl(r.t)},{t:'Último pedido',sv:r=>r.last,v:r=>fmtD(new Date(r.last))},{t:'Cartão fidelidade',sv:r=>r.q%10,h:r=>`<span class="stp" aria-label="${r.q%10} de 10 selos">${Array.from({length:10},(_,i)=>`<i class="${i<r.q%10?'on':''}"></i>`).join('')}</span>${Math.floor(r.q/10)?` <span class="tag ok">${Math.floor(r.q/10)} prêmio(s)</span>`:''}`}]})}
$$('.side .nv').forEach(b=>b.onclick=()=>{page=b.dataset.p;render();window.scrollTo(0,0)});
$('#mb').onclick=()=>$('.side').classList.toggle('open');$('#th').onclick=toggleTheme;$('#rs').onclick=()=>{['per','cx','items','cup'].forEach(store.del);location.reload()};
render();
</script></body></html>
